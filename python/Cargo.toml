[package]
name = "rocraters-python"
version = "0.6.0"
edition = "2021"
authors = ["Matt Burridge <m.burridge1@newcastle.ac.uk>"]
description = "Lightweight Python library for RO-Crate manipulation implemented in Rust"
license = "Apache-2.0"
keywords = ["ro-crate", "rocrate", "research object", "rocraters"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "rocraters"
crate-type = ["cdylib"]

[workspace]

[dependencies]
pyo3 = "0.30.1"
serde_json = "1.0.154"
chrono = { version = "0.4.45", features = ["serde"] }
serde_with = "3.24.0"
url = "2.5"

[dependencies.ro-crate-rs]
path = "../"
version = "0"

[features]
default = ["rdf", "subcrate-resolution"]
parquet = ["ro-crate-rs/parquet"]
rdf = ["ro-crate-rs/rdf"]
subcrate-resolution = ["ro-crate-rs/subcrate-resolution"]
