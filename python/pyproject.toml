[build-system]
requires = ["maturin>=1.9.3,<2.0"]
build-backend = "maturin"

[project]
name = "rocraters"
description = "Lightweight Python library for RO-Crate manipulation implemented in Rust"
readme = "README_py.md"
keywords = ["ro-crate", "rocrate", "research object", "rocraters"]
requires-python = ">=3.10"
license = "Apache-2.0"
# maturin includes python/LICENSE.md itself; listing it in license-files clashes
# with the root LICENSE.md that the path dependency adds to the sdist
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13"
]
dynamic = ["version"]

[tool.maturin]
features = ["pyo3/extension-module"]

