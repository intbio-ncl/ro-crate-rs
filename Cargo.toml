[package]
name = "ro-crate-rs"
version = "0.7.0"
edition = "2024"
repository = "https://github.com/intbio-ncl/ro-crate-rs"
authors = ["Matt Burridge <m.burridge1@newcastle.ac.uk>"]
autoexamples = false
license = "Apache-2.0"
description = "Library for creating, modifying and reading RO-Crates"
keywords = ["researchobject", "ro-crate", "ro", "metadata", "jsonld"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace]
members = ["cli"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.154"
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.28.0", features = ["v4", "v7"] }
rand = "0.10.3"
url = "2.5"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
walkdir = "2"
reqwest = { version = "0.13.5", features = [
    "blocking",
    "json",
], default-features = false }
dirs = "7.0.0"
polars = { version = "0.55.2", features = ["parquet"] }
log = "0.4.34"
thiserror = "2.0.21"
sha1 = "0.11.0"
sha2 = "0.11.1"
hex = "0.4.3"
bytes = "1.12.1"
regex = "1.13.1"
oxrdf = "0.3"
oxrdfio = "0.2"

[lib]
name = "rocraters"
path = "src/lib.rs"
doctest = false

[[bench]]
name = "create_and_write"
harness = false

[[bench]]
name = "rdf_perf"
harness = false
required-features = ["rdf"]

[[example]]
name = "rdf_export"
path = "examples/rdf_export.rs"
required-features = ["rdf"]

[features]
parquet = ["dep:polars"]
rdf = ["dep:oxrdf", "dep:oxrdfio"]
subcrate-resolution = [
    "dep:sha1",
    "dep:sha2",
    "dep:hex",
    "dep:bytes",
    "dep:regex",
]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
rand = { workspace = true }
url = { workspace = true }
zip = { workspace = true }
walkdir = { workspace = true }
reqwest = { workspace = true }
dirs = { workspace = true }
tempfile = "3.27"
polars = { workspace = true, optional = true }
thiserror = { workspace = true }
log = { workspace = true }
sha1 = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
regex = { workspace = true, optional = true }
oxrdf = { workspace = true, optional = true }
oxrdfio = { workspace = true, optional = true }


[dev-dependencies]
mockito = "1.7.2"
criterion = "0.8"
